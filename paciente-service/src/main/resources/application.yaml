server:
  port: 8081

spring:
  application:
    name: paciente-service
  r2dbc:
    url: ${DB_URL:r2dbc:postgresql://localhost:5432/db_hospital_pacientes}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}